<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Second Serve</title>
    <style>
      :root {
        --ink: #e8e6e1;
        --dim: #9a9890;
        --accent: #ffb547;
        --danger: #ff5a4f;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(ellipse at 50% 20%, #1c2236, #0a0e16 70%);
        color: var(--ink);
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      form {
        width: min(340px, calc(100% - 32px));
        padding: 30px 28px 24px;
        background: rgba(14, 16, 22, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 34px;
        letter-spacing: 0.08em;
        text-align: center;
      }

      p.sub {
        margin: 0 0 22px;
        text-align: center;
        font-size: 13px;
        font-style: italic;
        color: var(--dim);
      }

      label {
        display: block;
        margin: 12px 0 4px;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input[type='text'],
      input[type='password'] {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        text-transform: none;
        letter-spacing: 0;
        font-size: 14px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        font: inherit;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 0.06em;
        color: #1a1206;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      #msg {
        min-height: 20px;
        margin-top: 12px;
        text-align: center;
        font-size: 14px;
        color: var(--danger);
      }

      #msg.ok {
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <form id="login" autocomplete="on">
      <h1>Second Serve</h1>
      <p class="sub">Invite only. Sign in to play.</p>
      <label for="name">Name</label>
      <input id="name" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required />
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password" required />
      <label class="remember"><input id="remember" type="checkbox" /> Keep me signed in on this device</label>
      <button id="go" type="submit">Play</button>
      <div id="msg"></div>
    </form>

      const REMEMBER = 'secondserve.web.key';
      const enc = new TextEncoder();
      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
      const msg = document.getElementById('msg');
      const go = document.getElementById('go');

      async function unlock(name, password) {
        const base = await crypto.subtle.importKey('raw', enc.encode(`${name.trim().toLowerCase()}\n${password}`), 'PBKDF2', false, ['deriveKey']);
        for (const lock of VAULT.locks) {
          const kek = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(lock.salt), iterations: VAULT.iterations },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
          );
          try {
            return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(lock.iv) }, kek, bytes(lock.key)));
          } catch {
            // Not this lock: try the next one.
          }
        }
        return null;
      }

      // Decrypts the game with the game key and replaces this page with it.
      async function start(raw) {
        const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
        const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(VAULT.iv) }, key, bytes(VAULT.data));
        const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        document.open();
        document.write(html);
        document.close();
      }

      document.getElementById('login').addEventListener('submit', async (e) => {
        e.preventDefault();
        go.disabled = true;
        msg.className = 'ok';
        msg.textContent = 'Checking…';
        const raw = await unlock(document.getElementById('name').value, document.getElementById('pass').value);
        if (!raw) {
          go.disabled = false;
          msg.className = '';
          msg.textContent = 'That name and password don\'t match.';
          return;
        }
        msg.textContent = 'Loading the game…';
        try {
          if (document.getElementById('remember').checked) localStorage.setItem(REMEMBER, btoa(String.fromCharCode(...raw)));
        } catch {
          // Storage blocked: you'll just sign in again next time.
        }
        start(raw);
      });

      // Signed in before on this device (and the game hasn't been rebuilt since): straight in.
      (async () => {
        let saved = null;
        try {
          saved = localStorage.getItem(REMEMBER);
        } catch {
          return;
        }
        if (!saved) return;
        try {
          await start(bytes(saved));
        } catch {
          try { localStorage.removeItem(REMEMBER); } catch { /* ignore */ }
        }
      })();
    </script>
